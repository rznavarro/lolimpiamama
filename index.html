              "name": "¿Qué es la limpieza profunda?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Es un proceso que va más allá de la aspiración superficial: extrae ácaros, alérgenos, polvo acumulado, células muertas y residuos biológicos en el interior de tapices, colchones y alfombras con maquinaria profesional especializada y shampoo biodegradable."

                "@type": "Answer",

              }
            },
            {
              "@type": "Question",
              "name": "¿Queda sucio o mojado el lugar?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Para nada. Cada máquina utiliza como máximo 7 litros de agua de grifo. Trabajamos con total cuidado, protegiendo tus pisos delicados; si cae alguna gota, se seca de inmediato con microfibra. Tu hogar queda tan ordenado como al llegar."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué pasa con las manchas?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Todas las manchas se tratan una a una. En la modalidad de desmanchado, eliminamos las manchas por completo en el 90% de los casos y los olores en el 100%. Sin embargo, manchas muy antiguas, con tinte, aceite, slime o plumón permanente pueden atenuarse sin desaparecer completamente porque ya tiñeron la fibra."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cuánto demora el servicio?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Colchones: de 30 minutos a 1 hora (20 a 40 min en seco). Muebles y sillones: de 30 minutos a 3 horas según plazas. Alfombras: de 1 a 2 horas según metraje."
              }
            },
